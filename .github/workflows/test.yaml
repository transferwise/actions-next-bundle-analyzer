name: Test

on:
  push:
    branches:
      - main
      - v2
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/bootstrap

      - name: Run tests
        run: pnpm run test
